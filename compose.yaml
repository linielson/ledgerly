services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-ledgerly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerly}
      POSTGRES_DB: ledgerly
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
