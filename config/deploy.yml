# Kamal deploy configuration. How it fits together, and how to deploy: docs/deploy.md.

service: ledgerly

# Pushed to GitHub Container Registry (ghcr.io/linielson/ledgerly).
image: linielson/ledgerly

# Oracle Cloud Always Free, Ampere A1 (arm64), Ubuntu 24.04. The default user is `ubuntu`, not root:
# Docker was installed by hand and `ubuntu` is in the `docker` group (docs/deploy.md).
servers:
  web:
    - 129.213.35.35
ssh:
  user: ubuntu

# kamal-proxy terminates TLS with a Let's Encrypt certificate and routes by host. DNS: an A record for
# ledgerly.linirosa.com points at the server (Hostinger). Changing it? See "Changing the host" in docs/deploy.md.
# Health check: kamal-proxy only sends traffic to a new container after GET /up returns 200 (zero-downtime deploys).
proxy:
  ssl: true
  host: ledgerly.linirosa.com

registry:
  server: ghcr.io
  username: linielson
  password:
    - KAMAL_REGISTRY_PASSWORD

# The server is arm64; on Apple Silicon and on ubuntu-24.04-arm runners the build is native.
builder:
  arch: arm64

env:
  secret:
    - RAILS_MASTER_KEY
    - LEDGERLY_DATABASE_PASSWORD
  clear:
    # Must match proxy.host: config.hosts only accepts this Host header (production.rb).
    APP_HOST: ledgerly.linirosa.com
    # The Postgres accessory below, reachable by container name on Kamal's Docker network.
    DB_HOST: ledgerly-db
    # Solid Queue runs inside Puma; one server is enough for now.
    SOLID_QUEUE_IN_PUMA: true

accessories:
  db:
    image: postgres:18
    host: 129.213.35.35
    # No `port`: the database is never published outside the server.
    env:
      clear:
        POSTGRES_USER: ledgerly
      secret:
        # The app reads LEDGERLY_DATABASE_PASSWORD (database.yml); Postgres expects POSTGRES_PASSWORD.
        - POSTGRES_PASSWORD:LEDGERLY_DATABASE_PASSWORD
    directories:
      # Postgres 18 keeps its data under /var/lib/postgresql (the image changed the path in 18).
      - data:/var/lib/postgresql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Active Storage files (kept until the PDF ticket decides whether Active Storage stays).
volumes:
  - "ledgerly_storage:/rails/storage"

# Keeps the previous version's assets during a deploy, so pages already open don't lose their CSS/JS.
asset_path: /rails/public/assets
