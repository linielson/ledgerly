# Connection settings come from the environment, never from this file:
# - development and test: `.env` (copied from `.env.example` by `bin/setup`), the same file
#   Docker Compose reads for the port mapping in `compose.yaml`, so Rails and the container always agree.
# - CI: the defaults below match the PostgreSQL service container in `.github/workflows/ci.yml`.
# - production: environment variables set by the deploy.
#
# Avoid exporting DATABASE_URL in your shell: it overrides this file for the current environment,
# so running the test suite could point it at the development database and erase it.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  # 5434, not PostgreSQL's 5432: a locally installed PostgreSQL usually holds 5432 already.
  port: <%= ENV.fetch("DB_PORT") { 5434 } %>
  # Local-only credentials, the same defaults as compose.yaml; not secrets.
  username: <%= ENV.fetch("DB_USER") { "ledgerly" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "ledgerly" } %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ledgerly_development

# Erased and rebuilt from db/schema.rb by the test setup: never point it at the development or production database.
test:
  <<: *default
  database: ledgerly_test

production:
  primary: &primary_production
    <<: *default
    database: ledgerly_production
    # Overrides the local 5434 default inherited from `default`; production uses PostgreSQL's standard port.
    port: <%= ENV.fetch("DB_PORT") { 5432 } %>
    username: ledgerly
    password: <%= ENV["LEDGERLY_DATABASE_PASSWORD"] %>
  # Separate databases for Solid Cache, Solid Queue and Solid Cable, each with its own schema in db/.
  cache:
    <<: *primary_production
    database: ledgerly_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ledgerly_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ledgerly_production_cable
    migrations_paths: db/cable_migrate
