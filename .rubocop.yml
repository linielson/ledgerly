# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# House overrides on top of omakase. Why each one exists: docs/conventions.md#formatting.

# Omakase turns off both indentation cops, so a body indented at the wrong depth passes lint and the
# editor's format on save leaves it alone. Two spaces per level, and `private` methods indented one level
# deeper (the Rails style omakase itself configures).
Layout/IndentationWidth:
  Enabled: true

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: indented_internal_methods
